packages:
  - apps/*
  - packages/*

# Only install versions that have been public for at least a day (pnpm's default,
# made explicit so it's enforced strictly everywhere — Vercel already does).
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  # Pulled in by Qwik City's image plugin, which the Qwik app doesn't use; sharp ships prebuilt
  # binaries, so its fallback build script isn't needed.
  sharp: false
