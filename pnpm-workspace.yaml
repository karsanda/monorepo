packages:
  - apps/*
  - packages/*

# Only install versions that have been public for at least a day (pnpm's default,
# made explicit so it's enforced strictly everywhere — Vercel already does).
minimumReleaseAge: 1440

allowBuilds:
  cypress: true
  esbuild: true
  # Not needed: firebase is configured explicitly, and protobufjs only runs a version check.
  '@firebase/util': false
  protobufjs: false
