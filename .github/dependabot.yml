version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge (24h) so update PRs never fail to install.
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
